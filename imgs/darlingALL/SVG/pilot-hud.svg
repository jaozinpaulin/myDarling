<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800">

<rect width="100%" height="100%" fill="#0D0D0D"></rect>

<!-- GRID -->
<g stroke="#1a1a1a" stroke-width="1">

<line x1="0" y1="100" x2="1920" y2="100"></line>
<line x1="0" y1="200" x2="1920" y2="200"></line>
<line x1="0" y1="300" x2="1920" y2="300"></line>
<line x1="0" y1="400" x2="1920" y2="400"></line>
<line x1="0" y1="500" x2="1920" y2="500"></line>
<line x1="0" y1="600" x2="1920" y2="600"></line>

</g>

<!-- LINHA CENTRAL -->
<line x1="0" y1="400" x2="1920" y2="400" stroke="#00BFFF" stroke-width="2" opacity="0.4"></line>

<!-- LINHA VERTICAL -->
<line x1="960" y1="0" x2="960" y2="800" stroke="#FF2A2A" stroke-width="2" opacity="0.4"></line>

<!-- HUD BOX CENTRAL -->
<rect x="660" y="220" width="600" height="320" fill="none" stroke="#2b2b2b" stroke-width="2"></rect>

<!-- SETAS PARA PERSONAGENS -->

<polygon points="520,380 560,360 560,400" fill="#00BFFF" opacity="0.7"></polygon>

<polygon points="1400,360 1440,380 1400,400" fill="#FF2A2A" opacity="0.7"></polygon>

<!-- CANTOS FUTURISTAS -->

<g stroke-width="4" fill="none">

<path d="M0 120 L0 0 L120 0" stroke="#FF2A2A"></path>

<path d="M1800 0 L1920 0 L1920 120" stroke="#00BFFF"></path>

<path d="M0 680 L0 800 L120 800" stroke="#00BFFF"></path>

<path d="M1800 800 L1920 800 L1920 680" stroke="#FF2A2A"></path>

</g>

</svg>