<svg viewBox="0 0 1440 220" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- GRADIENTE AZUL -->
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.25"></stop>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0.05"></stop>
    </linearGradient>

    <!-- GRADIENTE CLARO -->
    <linearGradient id="whiteGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"></stop>
    </linearGradient>

    <!-- GRADIENTE VERMELHO -->
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E10600" stop-opacity="0.25"></stop>
      <stop offset="100%" stop-color="#ff4d4d" stop-opacity="0.05"></stop>
    </linearGradient>
  </defs>

  <!-- PLACA ESQUERDA -->
  <polygon points="0,80 300,140 500,0 0,0" fill="url(#blueGrad)"></polygon>

  <!-- PLACA CENTRAL -->
  <polygon points="500,0 900,150 1100,0" fill="url(#whiteGrad)"></polygon>

  <!-- PLACA DIREITA -->
  <polygon points="900,150 1440,100 1440,0" fill="url(#redGrad)"></polygon>

  <!-- LINHA DE QUEBRA -->
  <path d="M0 100 L1440 80" stroke="#ffffff" stroke-width="1" opacity="0.2"></path>

</svg>