<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 200" preserveAspectRatio="none">

<!-- fundo transparente -->

<!-- linhas diagonais -->
<g stroke-width="2" fill="none">

<line x1="0" y1="180" x2="400" y2="40" stroke="#00BFFF" opacity="0.4"></line>
<line x1="300" y1="200" x2="700" y2="20" stroke="#00BFFF" opacity="0.3"></line>
<line x1="600" y1="200" x2="1000" y2="20" stroke="#00BFFF" opacity="0.25"></line>

<line x1="1320" y1="20" x2="1720" y2="200" stroke="#FF2A2A" opacity="0.3"></line>
<line x1="1520" y1="40" x2="1920" y2="180" stroke="#FF2A2A" opacity="0.4"></line>

</g>

<!-- linha central -->
<line x1="0" y1="100" x2="1920" y2="100" stroke="white" stroke-width="1" opacity="0.08"></line>

<!-- pontos técnicos -->
<g>

<circle cx="300" cy="110" r="2" fill="#00BFFF" opacity="0.6"></circle>
<circle cx="600" cy="95" r="2" fill="#00BFFF" opacity="0.5"></circle>
<circle cx="1300" cy="100" r="2" fill="#FF2A2A" opacity="0.6"></circle>
<circle cx="1600" cy="85" r="2" fill="#FF2A2A" opacity="0.5"></circle>

</g>

</svg>